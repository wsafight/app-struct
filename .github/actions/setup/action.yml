name: AppStruct toolchain
description: Install the repository's Rust, Node.js and pnpm toolchains and restore dependency caches.
inputs:
  node:
    description: Install Node.js and pnpm with dependency caching.
    default: 'true'
  rust:
    description: Verify pinned Rust toolchain and restore Cargo caches.
    default: 'true'
  cache-build:
    description: Cache Cargo debug dependency artifacts; Cargo still validates current workspace inputs.
    default: 'false'
  cache-key:
    description: Disambiguating suffix for the build-artifact cache so jobs do not overwrite each other's target/ cache.
    default: ''
runs:
  using: composite
  steps:
    - name: Reserve integration test ports from ephemeral client allocation
      if: runner.os == 'Linux' && inputs.rust == 'true'
      shell: bash
      run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=30000-34999,51000-57999
    - if: inputs.node == 'true'
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      with:
        version: 11.25.0
    - if: inputs.node == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm
    - name: Install pinned Rust toolchain
      if: inputs.rust == 'true'
      shell: bash
      run: rustup show active-toolchain
    - if: inputs.rust == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-dependencies-${{ runner.os }}-${{ hashFiles('Cargo.toml', '**/Cargo.lock') }}
        restore-keys: |
          cargo-dependencies-${{ runner.os }}-
    - if: inputs.rust == 'true' && inputs.cache-build == 'true'
      uses: actions/cache@v4
      with:
        path: |
          target/debug/.fingerprint
          target/debug/build
          target/debug/deps
        key: cargo-build-${{ github.job }}-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml') }}
