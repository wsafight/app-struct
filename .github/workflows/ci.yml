name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      full: ${{ github.event_name != 'pull_request' }}
