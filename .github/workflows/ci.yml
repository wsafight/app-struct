name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - name: Check Rust dependency advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        env:
          APPSTRUCT_PERF_BUDGET_MULTIPLIER: 2
        run: cargo test --workspace --locked
      - run: bash scripts/check-local-installer.sh
      - run: scripts/verify-packages.sh
      - name: Remove cargo package verification artifacts
        if: always()
        run: |
          if [[ -d target/package ]]; then
            rm -r target/package
          fi

  postgres-e2e:
    uses: ./.github/workflows/postgres-e2e.yml

  template-build:
    uses: ./.github/workflows/template-build.yml

  deployment:
    uses: ./.github/workflows/deployment.yml
