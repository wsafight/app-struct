name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        env:
          APPSTRUCT_PERF_BUDGET_MULTIPLIER: 2
        run: cargo test --workspace --locked
      - run: scripts/verify-packages.sh
      - run: scripts/run-template-build.sh
      - name: Remove cargo package verification artifacts
        if: always()
        run: |
          if [[ -d target/package ]]; then
            rm -r target/package
          fi

  postgres-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: browser
            script: scripts/run-m5-browser-e2e.sh
            database: appstruct_browser_e2e
            browsers: true
          - suite: audit
            script: scripts/run-m6-audit-e2e.sh
            database: appstruct_audit_e2e
            browsers: true
          - suite: mail
            script: scripts/run-m6-mail-e2e.sh
            database: appstruct_mail_e2e
            browsers: false
          - suite: file
            script: scripts/run-m6-file-e2e.sh
            database: appstruct_file_e2e
            browsers: false
          - suite: bulk
            script: scripts/run-m6-bulk-e2e.sh
            database: appstruct_bulk_e2e
            browsers: false
          - suite: jobs
            script: scripts/run-m6-jobs-e2e.sh
            database: appstruct_e2e
            browsers: false
          - suite: tenant
            script: scripts/run-m6-tenant-e2e.sh
            database: appstruct_tenant_e2e
            browsers: true
          - suite: saas
            script: scripts/run-m6-saas-e2e.sh
            database: appstruct_saas_e2e
            browsers: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ${{ matrix.database }}
          POSTGRES_PASSWORD: appstruct
          POSTGRES_USER: appstruct
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appstruct -d ${{ matrix.database }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Playwright Chromium
        if: matrix.browsers
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Run ${{ matrix.suite }} PostgreSQL E2E
        env:
          APPSTRUCT_E2E_DATABASE_URL: postgresql://appstruct:appstruct@127.0.0.1:5432/${{ matrix.database }}
        run: ${{ matrix.script }}
