name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        env:
          APPSTRUCT_PERF_BUDGET_MULTIPLIER: 2
        run: cargo test --workspace --locked
      - run: scripts/verify-packages.sh
      - run: scripts/run-template-build.sh
      - name: Remove cargo package verification artifacts
        if: always()
        run: |
          if [[ -d target/package ]]; then
            rm -r target/package
          fi

  postgres-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: appstruct_e2e
          POSTGRES_PASSWORD: appstruct
          POSTGRES_USER: appstruct
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appstruct -d appstruct_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Run schedules, webhooks, realtime, and jobs E2E
        env:
          APPSTRUCT_E2E_DATABASE_URL: postgresql://appstruct:appstruct@127.0.0.1:5432/appstruct_e2e
        run: scripts/run-m6-jobs-e2e.sh
