name: First Deployment
on:
  workflow_call:
permissions:
  contents: read
jobs:
  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: appstruct_deployment_test
          POSTGRES_USER: appstruct
          POSTGRES_PASSWORD: appstruct
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U appstruct -d appstruct_deployment_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify production images and same-origin Web
        env:
          APPSTRUCT_E2E_DATABASE_URL: postgresql://appstruct:appstruct@127.0.0.1:5432/appstruct_deployment_test
        run: bash scripts/run-deployment-e2e.sh
      - name: Save deployment screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: first-deployment
          path: output/deployment/
          if-no-files-found: ignore
