name: Docs

on:
  push:
    paths:
      - 'docs/**'
      - 'site/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'PRODUCT.md'
      - 'PRODUCT.en.md'
      - 'TECHNICAL_DESIGN.md'
      - 'TECHNICAL_DESIGN.en.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'site/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'PRODUCT.md'
      - 'PRODUCT.en.md'
      - 'TECHNICAL_DESIGN.md'
      - 'TECHNICAL_DESIGN.en.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOCS_SITE: ${{ vars.DOCS_SITE }}
      DOCS_BASE: ${{ vars.DOCS_BASE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run check
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm test
        working-directory: site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appstruct-site
          path: site/dist
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        with:
          path: site/dist

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
