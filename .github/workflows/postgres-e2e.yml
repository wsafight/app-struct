name: PostgreSQL E2E

on:
  workflow_call:

permissions:
  contents: read

jobs:
  postgres-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: benchmark
            script: bash scripts/run-postgres-benchmark.sh
            database: appstruct_benchmark_test
            browsers: false
          - suite: authorization
            script: bash scripts/run-authorization-e2e.sh
            database: appstruct_authorization_e2e
            browsers: false
          - suite: chromium-report
            script: bash scripts/run-chromium-report-e2e.sh
            database: appstruct_chromium_report_e2e
            browsers: true
          - suite: browser
            script: scripts/run-m5-browser-e2e.sh
            database: appstruct_browser_e2e
            browsers: true
          - suite: audit
            script: scripts/run-m6-audit-e2e.sh
            database: appstruct_audit_e2e
            browsers: true
          - suite: mail
            script: scripts/run-m6-mail-e2e.sh
            database: appstruct_mail_e2e
            browsers: false
          - suite: file
            script: scripts/run-m6-file-e2e.sh
            database: appstruct_file_e2e
            browsers: false
          - suite: bulk
            script: scripts/run-m6-bulk-e2e.sh
            database: appstruct_bulk_e2e
            browsers: false
          - suite: jobs
            script: scripts/run-m6-jobs-e2e.sh
            database: appstruct_e2e
            browsers: false
          - suite: tenant
            script: scripts/run-m6-tenant-e2e.sh
            database: appstruct_tenant_e2e
            browsers: true
          - suite: saas
            script: scripts/run-m6-saas-e2e.sh
            database: appstruct_saas_e2e
            browsers: true
          - suite: operations
            script: scripts/run-operations-e2e.sh
            database: appstruct_operations_e2e
            browsers: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ${{ matrix.database }}
          POSTGRES_PASSWORD: appstruct
          POSTGRES_USER: appstruct
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appstruct -d ${{ matrix.database }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Playwright Chromium
        if: matrix.browsers
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Run ${{ matrix.suite }} PostgreSQL E2E
        env:
          APPSTRUCT_E2E_DATABASE_URL: postgresql://appstruct:appstruct@127.0.0.1:5432/${{ matrix.database }}
        run: ${{ matrix.script }}
      - name: Upload database workload results
        if: always() && matrix.suite == 'benchmark'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postgres-workload
          path: output/benchmarks/
          if-no-files-found: ignore
