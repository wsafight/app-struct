name: Quality gates

on:
  workflow_call:
    inputs:
      full:
        description: Run all PostgreSQL modules, production containers, Windows installer, packaging and benchmarks.
        type: boolean
        default: false
      run_rust:
        description: Run Rust format, clippy, unit tests, workflow lint, and script checks.
        type: boolean
        default: true
      run_cargo_audit:
        description: Run cargo-deny and cargo-machete checks.
        type: boolean
        default: false
      run_docs:
        description: Run documentation site check, build, and Playwright tests.
        type: boolean
        default: false
      run_templates:
        description: Run generated template build smoke checks.
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: '0'
  APPSTRUCT_PERF_BUDGET_MULTIPLIER: '2'

jobs:
  cli:
    name: Linux CLI artifact
    if: inputs.full || inputs.run_templates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node: 'false'
          cache-build: 'true'
      - run: cargo build --locked -p appstruct-cli
      - run: sha256sum target/debug/appstruct > target/debug/appstruct.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: appstruct-cli-linux-${{ github.sha }}
          path: |
            target/debug/appstruct
            target/debug/appstruct.sha256
          compression-level: 0
          retention-days: 1

  rust:
    name: Rust
    if: inputs.full || inputs.run_rust
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-build: 'true'
      - run: pnpm install --frozen-lockfile
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=''
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python3 scripts/test-record-journey.py
      - name: Check shell scripts and E2E cleanup
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          bash scripts/test-e2e-cleanup.sh
          bash scripts/test-template-build.sh
      - name: Install cargo-deny and cargo-machete
        if: inputs.full || inputs.run_cargo_audit
        run: |
          curl -fsSL https://github.com/cargo-bins/cargo-binstall/releases/download/v1.17.0/cargo-binstall-x86_64-unknown-linux-musl.tgz -o cargo-binstall.tgz
          tar -xzf cargo-binstall.tgz
          ./cargo-binstall --no-confirm --version 0.20.2 cargo-deny
          ./cargo-binstall --no-confirm cargo-machete
      - if: inputs.full || inputs.run_cargo_audit
        run: cargo deny check
      - if: inputs.full || inputs.run_cargo_audit
        run: cargo machete

  templates:
    name: Template (${{ matrix.template }})
    if: inputs.full || inputs.run_templates
    needs: cli
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(inputs.full && '["minimal", "dashboard", "saas"]' || '["minimal"]') }}
    env:
      APPSTRUCT_TEMPLATE: ${{ matrix.template }}
      APPSTRUCT_TEMPLATE_CLI: ${{ github.workspace }}/target/debug/appstruct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: appstruct-cli-linux-${{ github.sha }}
          path: target/debug
      - run: sha256sum -c target/debug/appstruct.sha256 && chmod +x target/debug/appstruct
      - run: bash scripts/run-template-build.sh

  docs:
    name: Documentation
    if: inputs.full || inputs.run_docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          rust: 'false'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run site:check
      - run: pnpm run site:build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run site:test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: docs-diagnostics
          path: site/test-results/
          if-no-files-found: ignore
          retention-days: 7

  saas-product-browser:
    name: SaaS product browser
    if: inputs.full
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APPSTRUCT_E2E_LOG_DIR: ${{ github.workspace }}/output/e2e-logs
      APPSTRUCT_E2E_STARTUP_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: bash scripts/run-saas-product-browser-e2e.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: saas-product-browser-diagnostics
          path: |
            output/e2e-logs/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  postgres:
    name: PostgreSQL (${{ matrix.suite }})
    if: inputs.full
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: ["authorization", "product", "m6-query", "operations", "m5-browser", "m6-tenant", "m6-audit", "m6-mail", "m6-jobs", "m6-file", "m6-saas", "m6-bulk"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: appstruct
          POSTGRES_PASSWORD: appstruct-ci
          POSTGRES_DB: appstruct_ci_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U appstruct -d appstruct_ci_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APPSTRUCT_E2E_DATABASE_URL: postgresql://appstruct:appstruct-ci@127.0.0.1:5432/appstruct_ci_e2e?sslmode=disable
      APPSTRUCT_E2E_LOG_DIR: ${{ github.workspace }}/output/e2e-logs
      APPSTRUCT_E2E_STARTUP_TIMEOUT: '600'
      E2E_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-build: 'true'
          cache-key: ${{ matrix.suite }}
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - if: matrix.suite == 'operations' || matrix.suite == 'm5-browser' || matrix.suite == 'm6-tenant' || matrix.suite == 'm6-audit' || matrix.suite == 'm6-saas'
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify migration and database introspection contracts
        if: matrix.suite == 'authorization'
        run: |
          cargo test --locked -p appstruct-migrate --test postgres --test module_indexes
          cargo test --locked -p appstruct-cli --test db_pull_cli --test migration_baseline
          cargo test --locked -p appstruct-codegen --test auth_rate_limit --test data_lifecycle --test extension_journey --test import_batches --test form_rules --test relation_access
      - name: Run PostgreSQL suite
        run: bash "scripts/run-$E2E_SUITE-e2e.sh"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: postgres-${{ matrix.suite }}-diagnostics
          path: |
            output/e2e-logs/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deployment:
    name: Docker deployment
    if: inputs.full
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: appstruct
          POSTGRES_PASSWORD: appstruct-ci
          POSTGRES_DB: appstruct_deployment_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U appstruct -d appstruct_deployment_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APPSTRUCT_E2E_DATABASE_URL: postgresql://appstruct:appstruct-ci@127.0.0.1:5432/appstruct_deployment_e2e?sslmode=disable
      APPSTRUCT_E2E_LOG_DIR: ${{ github.workspace }}/output/e2e-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-build: 'true'
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: bash scripts/run-deployment-e2e.sh --docker
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deployment-diagnostics
          path: |
            output/deployment/
            output/e2e-logs/
          if-no-files-found: ignore
          retention-days: 7

  windows-installer:
    name: Windows installer
    if: inputs.full
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node: 'false'
      - name: Build native CLI and test local archive installation
        run: |
          $ErrorActionPreference = 'Stop'
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust toolchain setup failed' }
          cargo build --release --locked -p appstruct-cli --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Windows CLI build failed' }
          $metadataJson = cargo metadata --locked --no-deps --format-version=1
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $metadata = $metadataJson | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq 'appstruct-cli' }).version
          ./scripts/package-release.ps1 -Version $version -Binary 'target/x86_64-pc-windows-msvc/release/appstruct.exe' -OutputDir dist
          ./scripts/test-installer.ps1 -ArchiveDir dist -Version $version
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-installer-archives
          path: dist/*
          if-no-files-found: ignore
          retention-days: 7

  packages:
    name: Package verification
    if: inputs.full
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node: 'false'
          cache-build: 'true'
      - run: bash scripts/verify-packages.sh

  benchmarks:
    name: Benchmark (${{ matrix.workload }})
    if: inputs.full
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        workload: [developer-experience, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: appstruct
          POSTGRES_PASSWORD: appstruct-ci
          POSTGRES_DB: appstruct_benchmark_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U appstruct -d appstruct_benchmark_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APPSTRUCT_E2E_DATABASE_URL: postgresql://appstruct:appstruct-ci@127.0.0.1:5432/appstruct_benchmark_e2e?sslmode=disable
      APPSTRUCT_E2E_LOG_DIR: ${{ github.workspace }}/output/e2e-logs
      BENCHMARK_WORKLOAD: ${{ matrix.workload }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-build: 'true'
          cache-key: ${{ matrix.workload }}
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client
      - run: bash "scripts/run-$BENCHMARK_WORKLOAD-benchmark.sh"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-${{ matrix.workload }}
          path: |
            output/benchmarks/
            output/e2e-logs/
          if-no-files-found: ignore
          retention-days: 30
