name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: scripts/verify-packages.sh
      - run: scripts/run-template-build.sh

  binaries:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - name: Validate tag version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$version" = "$manifest_version"
      - name: Build binary
        run: cargo build --release --locked -p appstruct-cli --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        run: |
          archive="appstruct-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir -p "dist/$archive"
          cp "target/${{ matrix.target }}/release/appstruct" "dist/$archive/"
          cp README.md "dist/$archive/"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$archive.tar.gz" > "$archive.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$archive.tar.gz" > "$archive.tar.gz.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: appstruct-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: appstruct-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
