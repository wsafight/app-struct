name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        env:
          APPSTRUCT_PERF_BUDGET_MULTIPLIER: 2
        run: cargo test --workspace --locked
      - run: scripts/verify-packages.sh
      - run: scripts/run-template-build.sh

  binaries:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: unix
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: unix
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            package: unix
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            package: unix
            musl: true
          - os: macos-15
            target: aarch64-apple-darwin
            package: unix
          - os: macos-15-intel
            target: x86_64-apple-darwin
            package: unix
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            package: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - name: Validate tag version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$version" = "$manifest_version"
      - name: Install musl toolchain
        if: matrix.musl == true
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p appstruct-cli --target ${{ matrix.target }}
      - name: Package Unix binary
        if: matrix.package == 'unix'
        shell: bash
        run: |
          archive="appstruct-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir -p "dist/$archive"
          cp "target/${{ matrix.target }}/release/appstruct" "dist/$archive/"
          cp README.md "dist/$archive/"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$archive.tar.gz" > "$archive.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$archive.tar.gz" > "$archive.tar.gz.sha256")
          fi
      - name: Package Windows binary
        if: matrix.package == 'windows'
        shell: pwsh
        run: |
          $archive = "appstruct-$($env:GITHUB_REF_NAME.Substring(1))-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$archive" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/appstruct.exe" "dist/$archive/"
          Copy-Item README.md "dist/$archive/"
          Compress-Archive -Path "dist/$archive" -DestinationPath "dist/$archive.zip"
          $hash = (Get-FileHash "dist/$archive.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive.zip" | Set-Content -Encoding ascii "dist/$archive.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: appstruct-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: appstruct-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
