name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
          version="$(cargo metadata --locked --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "appstruct-cli") | .version')"
          [[ "$version" == "${TAG#v}" ]] || { echo "Tag $TAG does not match CLI version $version" >&2; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"

  verify:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build:
    needs: [validate, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = '${{ matrix.target }}'
      - run: cargo build --release --locked -p appstruct-cli --target ${{ matrix.target }}
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          bash scripts/package-release.sh "$RELEASE_VERSION" '${{ matrix.target }}' 'target/${{ matrix.target }}/release/appstruct' dist
          bash scripts/test-installer.sh dist "$RELEASE_VERSION" '${{ matrix.target }}'
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION -Binary 'target/${{ matrix.target }}/release/appstruct.exe' -OutputDir dist
          ./scripts/test-installer.ps1 -ArchiveDir dist -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  draft:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            case "$target" in *windows*) extension=zip ;; *) extension=tar.gz ;; esac
            test -s "dist/appstruct-$RELEASE_VERSION-$target.$extension"
            test -s "dist/appstruct-$RELEASE_VERSION-$target.$extension.sha256"
          done
          (cd dist && sha256sum -c ./*.sha256)
          cp scripts/install.sh scripts/install.ps1 dist/
          (cd dist && sha256sum install.sh install.ps1 > installers.sha256)
          (cd dist && sha256sum install.sh > install.sh.sha256 && sha256sum install.ps1 > install.ps1.sha256)
          gh release create "v$RELEASE_VERSION" dist/* --draft --verify-tag --title "AppStruct v$RELEASE_VERSION" --generate-notes
