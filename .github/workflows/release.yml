name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          shared-key: release-quality
      - name: Check Rust dependency advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        env:
          APPSTRUCT_PERF_BUDGET_MULTIPLIER: 2
        run: cargo test --workspace --locked
      - run: scripts/verify-packages.sh

  postgres-e2e:
    uses: ./.github/workflows/postgres-e2e.yml

  template-build:
    uses: ./.github/workflows/template-build.yml

  deployment:
    uses: ./.github/workflows/deployment.yml

  report-renderer:
    uses: ./.github/workflows/report-renderer.yml

  binaries:
    needs: [quality, postgres-e2e, template-build, deployment, report-renderer]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: unix
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: unix
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            package: unix
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            package: unix
            musl: true
          - os: macos-15
            target: aarch64-apple-darwin
            package: unix
          - os: macos-15-intel
            target: x86_64-apple-darwin
            package: unix
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            package: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          shared-key: release-${{ matrix.target }}
      - name: Validate tag version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$version" = "$manifest_version"
      - name: Install musl toolchain
        if: matrix.musl == true
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p appstruct-cli --target ${{ matrix.target }}
      - name: Package Unix binary
        if: matrix.package == 'unix'
        shell: bash
        run: |
          archive="appstruct-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir -p "dist/$archive"
          cp "target/${{ matrix.target }}/release/appstruct" "dist/$archive/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$archive/"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$archive.tar.gz" > "$archive.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$archive.tar.gz" > "$archive.tar.gz.sha256")
          fi
      - name: Package Windows binary
        if: matrix.package == 'windows'
        shell: pwsh
        run: |
          $archive = "appstruct-$($env:GITHUB_REF_NAME.Substring(1))-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$archive" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/appstruct.exe" "dist/$archive/"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE "dist/$archive/"
          Compress-Archive -Path "dist/$archive" -DestinationPath "dist/$archive.zip"
          $hash = (Get-FileHash "dist/$archive.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive.zip" | Set-Content -Encoding ascii "dist/$archive.zip.sha256"
      - name: Verify Unix installer
        if: matrix.package == 'unix'
        shell: bash
        run: bash scripts/test-installer.sh dist "${GITHUB_REF_NAME#v}" "${{ matrix.target }}"
      - name: Verify Windows installer
        if: matrix.package == 'windows'
        shell: pwsh
        run: ./scripts/test-installer.ps1 -ArchiveDir dist -Version $env:GITHUB_REF_NAME.Substring(1)
      - name: Package installers
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          cd dist
          sha256sum install.sh > install.sh.sha256
          sha256sum install.ps1 > install.ps1.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appstruct-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/install.sh
            dist/install.ps1
          if-no-files-found: error

  release:
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: appstruct-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
