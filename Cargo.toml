[workspace]
members = [
  "crates/appstruct-cli",
  "crates/appstruct-codegen",
  "crates/appstruct-contracts",
  "crates/appstruct-compiler",
  "crates/appstruct-ir",
  "crates/appstruct-module-sdk",
  "crates/appstruct-migrate",
  "crates/appstruct-runtime",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/wsafight/app-struct"

[workspace.dependencies]
appstruct-codegen = { version = "0.1.0", path = "crates/appstruct-codegen" }
appstruct-contracts = { version = "0.1.0", path = "crates/appstruct-contracts" }
appstruct-compiler = { version = "0.1.0", path = "crates/appstruct-compiler" }
appstruct-ir = { version = "0.1.0", path = "crates/appstruct-ir" }
appstruct-module-sdk = { version = "0.1.0", path = "crates/appstruct-module-sdk" }
appstruct-migrate = { version = "0.1.0", path = "crates/appstruct-migrate" }
appstruct-runtime = { version = "0.1.0", path = "crates/appstruct-runtime" }
async-trait = "0.1.89"
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive"] }
cron = "0.15.0"
ctrlc = "3.5.2"
dotenvy = "0.15.7"
ed25519-dalek = "2.2.0"
native-tls = "0.2.14"
minijinja = "=2.12.0"
notify = "8.2.0"
postgres = "0.19.12"
postgres-native-tls = "0.5.3"
proc-macro2 = "1.0.101"
quote = "1.0.40"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
saphyr-parser = "0.0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
similar = "2.7.0"
toml = "1.1.4"
syn = { version = "2.0.106", features = ["full"] }
tempfile = "3.27.0"
jsonschema = { version = "0.51.0", default-features = false }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.25.0", features = ["serde", "v7"] }
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
