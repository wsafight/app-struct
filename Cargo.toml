[workspace]
members = [
  "crates/appstruct-cli",
  "crates/appstruct-codegen",
  "crates/appstruct-core",
  "crates/appstruct-contracts",
  "crates/appstruct-compiler",
  "crates/appstruct-ir",
  "crates/appstruct-module-sdk",
  "crates/appstruct-migrate",
  "crates/appstruct-runtime",
  "crates/appstruct-schema",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/wsafight/app-struct"

[workspace.dependencies]
appstruct-codegen = { version = "0.1.0", path = "crates/appstruct-codegen" }
appstruct-core = { version = "0.1.0", path = "crates/appstruct-core" }
appstruct-contracts = { version = "0.1.0", path = "crates/appstruct-contracts" }
appstruct-compiler = { version = "0.1.0", path = "crates/appstruct-compiler" }
appstruct-ir = { version = "0.1.0", path = "crates/appstruct-ir" }
appstruct-module-sdk = { version = "0.1.0", path = "crates/appstruct-module-sdk" }
appstruct-migrate = { version = "0.1.0", path = "crates/appstruct-migrate" }
appstruct-runtime = { version = "0.1.0", path = "crates/appstruct-runtime" }
appstruct-schema = { version = "0.1.0", path = "crates/appstruct-schema" }
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
cron = "0.17.0"
ctrlc = "3.5.2"
dotenvy = "0.15.7"
ed25519-dalek = "3.0.0"
native-tls = "0.2.18"
minijinja = "=2.24.0"
notify = "8.2.0"
oxc_parser = "=0.152.0"
oxc_span = "=0.152.0"
oxc_allocator = "=0.152.0"
oxc_ast = "=0.152.0"
postgres = "0.19.14"
postgres-native-tls = "0.5.3"
proc-macro2 = "1.0.107"
quote = "1.0.47"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
saphyr-parser = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
toml = "1.1.6"
syn = { version = "3.0.6", features = ["full"] }
tempfile = "3.27.0"
jsonschema = { version = "0.58.2", default-features = false }
hex = "0.4.3"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.26.1", features = ["serde", "v7"] }
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
