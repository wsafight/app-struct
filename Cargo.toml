[workspace]
members = [
  "crates/appstruct-cli",
  "crates/appstruct-codegen",
  "crates/appstruct-compiler",
  "crates/appstruct-ir",
  "crates/appstruct-migrate",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
readme = "README.md"

[workspace.dependencies]
appstruct-codegen = { version = "0.1.0", path = "crates/appstruct-codegen" }
appstruct-compiler = { version = "0.1.0", path = "crates/appstruct-compiler" }
appstruct-ir = { version = "0.1.0", path = "crates/appstruct-ir" }
appstruct-migrate = { version = "0.1.0", path = "crates/appstruct-migrate" }
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = "3.5.2"
dotenvy = "0.15.7"
native-tls = "0.2.14"
minijinja = "=2.12.0"
prettyplease = "0.2.37"
postgres = "0.19.12"
postgres-native-tls = "0.5.3"
proc-macro2 = "1.0.101"
quote = "1.0.40"
saphyr-parser = "0.0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
toml = "0.9.8"
syn = { version = "2.0.106", features = ["full"] }
tempfile = "3.27.0"
jsonschema = { version = "0.51.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
