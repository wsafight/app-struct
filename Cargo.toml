[workspace]
members = [
  "crates/appstruct-cli",
  "crates/appstruct-codegen",
  "crates/appstruct-compiler",
  "crates/appstruct-ir",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
appstruct-codegen = { path = "crates/appstruct-codegen" }
appstruct-compiler = { path = "crates/appstruct-compiler" }
appstruct-ir = { path = "crates/appstruct-ir" }
clap = { version = "4.6.6", features = ["derive"] }
prettyplease = "0.2.37"
proc-macro2 = "1.0.101"
quote = "1.0.40"
saphyr-parser = "0.0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syn = { version = "2.0.106", features = ["full"] }
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
