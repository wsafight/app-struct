version: 1

app:
  name: __APPSTRUCT_PROJECT_NAME__

database:
  provider: postgres
  dev:
    mode: managed

modules:
  auth:
    enabled: true
    user_entity: User
    registration: true
    password_reset: true
  rbac:
    roles: [member, admin]
    default_role: member

includes:
  - spec/identity.yaml
  - spec/project.yaml
