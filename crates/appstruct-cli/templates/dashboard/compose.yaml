services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: appstruct
      POSTGRES_USER: appstruct
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appstruct-dev}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appstruct -d appstruct"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - appstruct-postgres:/var/lib/postgresql/data

volumes:
  appstruct-postgres:
