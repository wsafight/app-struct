# Dependency policy for the AppStruct workspace.
#
# Run locally with `cargo deny check` (needs cargo-deny 0.20.2 or newer) and in CI.
# See docs/releasing.md for the release preflight.

[advisories]
version = 2
ignore = []
yanked = "deny"

[licenses]
version = 2
# Permissive licenses only. Every entry below is required by at least one crate in
# the current graph; `unused-allowed-license = "allow"` keeps the list stable as
# dependencies move between permissive options (for example `MIT OR Apache-2.0`).
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
  "MIT-0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]

[bans]
# Deny new duplicates; the unavoidable ones below are skipped explicitly.
# `cron` pulls the entire phf@0.11 / rand@0.8 / syn@2 / winnow@0.7 subtree; most
# of it disappears if `cron` is replaced with a lighter parser.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
  { name = "phf", version = "0.11" },
  { name = "phf_generator", version = "0.11" },
  { name = "phf_macros", version = "0.11" },
  { name = "phf_shared", version = "0.11" },
  { name = "phf", version = "0.13" },
  { name = "phf_shared", version = "0.13" },
  { name = "rand", version = "0.8" },
  { name = "rand_core", version = "0.6" },
  { name = "syn", version = "2" },
  { name = "winnow", version = "0.7" },
  { name = "const-oid", version = "0.9" },
  # Target-gated duplicates seen on non-Linux builds.
  { name = "base64", version = "0.22" },
  { name = "wasi", version = "0.11" },
  { name = "windows-sys", version = "0.60" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
