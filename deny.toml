# Dependency policy for the AppStruct workspace.
#
# Run locally with `cargo deny check` (needs cargo-deny 0.20.2 or newer) and in CI.
# See docs/releasing.md for the release preflight.

[advisories]
version = 2
ignore = []
yanked = "deny"

[licenses]
version = 2
# Permissive licenses only. Every entry below is required by at least one crate in
# the current graph; `unused-allowed-license = "allow"` keeps the list stable as
# dependencies move between permissive options (for example `MIT OR Apache-2.0`).
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
  "MIT-0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `postgres` and the ICU stack are pulled in transitively; a single-version policy
# would require upstream releases we do not control.
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
