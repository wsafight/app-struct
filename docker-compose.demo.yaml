services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: appstruct
      POSTGRES_USER: appstruct
      POSTGRES_PASSWORD: appstruct-demo-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appstruct -d appstruct"]
      interval: 2s
      timeout: 3s
      retries: 25
    volumes:
      - appstruct-demo-pg:/var/lib/postgresql/data

  demo:
    build:
      context: .
      dockerfile: docker/demo/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://appstruct:appstruct-demo-password@postgres:5432/appstruct?sslmode=disable
      APPSTRUCT_BIND: 127.0.0.1:3000
      APPSTRUCT_ENV: development
      APPSTRUCT_AUTH_MAIL_MODE: capture
      APPSTRUCT_ALLOWED_ORIGIN: http://localhost:8080
      APPSTRUCT_FILE_ROOT: /demo/.appstruct/files
    ports:
      - "${APPSTRUCT_DEMO_PORT:-8080}:8080"

volumes:
  appstruct-demo-pg:
