[package]
name = "appstruct-app-backend"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
appstruct-generated-backend = { path = "../../generated/backend" }
async-trait = "=0.1.92"
axum = "=0.8.9"
chrono = { version = "=0.4.45", features = ["serde"] }
futures-util = "=0.3.34"
async-stream = "=0.3.6"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.153"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono", "json", "uuid"] }
tokio = { version = "=1.53.3", features = ["sync", "time", "macros", "rt-multi-thread"] }
uuid = { version = "=1.28.0", features = ["serde", "v7"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
