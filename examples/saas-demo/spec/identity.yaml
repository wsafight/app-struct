domain: identity

entities:
  User:
    label: Users
    table: users
    fields:
      id:
        type: uuid
        primary_key: true
        generated: uuid_v7
      email:
        type: string
        required: true
        unique: true
        max_length: 320
        searchable: true
    access:
      list: { role: admin }
      read: { role: admin }
      create: { role: admin }
      update: { role: admin }
      delete: { role: admin }
