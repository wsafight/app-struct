domain: identity

entities:
  User:
    label: User
    table: users
    fields:
      id:
        type: uuid
        primary_key: true
        generated: uuid_v7
      email:
        type: string
        required: true
        max_length: 320
        searchable: true
    access:
      list:
        role: member
      read:
        role: member
      create:
        role: admin
      update:
        role: admin
      delete:
        role: admin
