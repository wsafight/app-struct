version: 1

app:
  name: bulk-lab

database:
  provider: postgres
  dev:
    mode: external
    migration: auto

modules:
  auth:
    enabled: true
    user_entity: User
    registration: true
    password_reset: false
  rbac:
    roles: [member, admin]
    default_role: member
  tenant:
    enabled: true
  audit:
    enabled: true
    reader_roles: [admin]

includes:
  - spec/entry.yaml
  - spec/identity.yaml
