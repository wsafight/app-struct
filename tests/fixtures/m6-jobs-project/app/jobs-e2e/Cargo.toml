[package]
name = "appstruct-jobs-e2e"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
appstruct-generated-backend = { path = "../../generated/backend" }
async-trait = "=0.1.89"
chrono = "=0.4.45"
sea-orm = { version = "=2.0.2", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres", "with-uuid"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }
uuid = "=1.25.0"
