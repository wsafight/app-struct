domain: sales

entities:
  Order:
    label: Orders
    table: orders
    tenant: true
    audit: true
    soft_delete: true
    fields:
      id:
        type: uuid
        primary_key: true
        generated: uuid_v7
      number:
        type: string
        required: true
        unique: true
        max_length: 32
      status:
        type: enum
        required: true
        values: [draft, approved]
      owner:
        type: relation
        target: User
        required: true
        on_delete: restrict
      created_at:
        type: datetime
        generated: now
      deleted_at:
        type: datetime
    workflow:
      field: status
      initial: draft
      transitions:
        approve:
          from: [draft]
          to: approved
          access: { role: admin }
    access:
      list: { authenticated: true }
      read:
        any:
          - { owner: owner }
          - { role: admin }
      create: { authenticated: true }
      update:
        any:
          - { owner: owner }
          - { role: admin }
      delete: { role: admin }
