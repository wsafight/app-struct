domain: project

entities:
  Project:
    label: Project
    table: projects
    fields:
      id:
        type: uuid
        primary_key: true
        generated: uuid_v7
      name:
        type: string
        required: true
        max_length: 120
        searchable: true
        sortable: true
      status:
        type: enum
        values: [draft, active, archived]
        default: draft
        filterable: true
      owner:
        type: relation
        target: User
        required: true
        on_delete: restrict
      created_at:
        type: datetime
        generated: now
        sortable: true
    access:
      list:
        any:
          - owner: owner
          - role: admin
      read:
        any:
          - owner: owner
          - role: admin
      create:
        any:
          - owner: owner
          - role: admin
      update:
        any:
          - owner: owner
          - role: admin
      delete:
        role: admin
